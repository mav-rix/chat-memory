[project]
name = "keepsake"
version = "0.6.0"
description = "A small, local MCP server that gives AI chats persistent memory (Claude Code, GitHub Copilot and other MCP clients)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
semantic = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]
dev = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
keepsake = "keepsake.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keepsake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
