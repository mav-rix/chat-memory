[project]
name = "chat-memory"
version = "0.4.0"
description = "A small, local MCP server that gives AI chats persistent memory (SQLite + full-text search)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
semantic = ["onnxruntime>=1.20", "tokenizers>=0.20", "numpy>=1.26"]
dev = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
chat-memory = "chat_memory.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
